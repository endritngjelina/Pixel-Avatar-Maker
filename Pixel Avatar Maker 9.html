<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Avatar Maker - Professional Edition</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            overflow-x: auto;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            color: white;
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 300;
            margin-bottom: 10px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 400px 300px;
            gap: 30px;
            flex: 1;
        }

        .canvas-section {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .canvas-container {
            position: relative;
            margin-bottom: 20px;
        }

        #pixelCanvas {
            border: 3px solid #e0e6ed;
            border-radius: 10px;
            cursor: crosshair;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            transition: transform 0.2s ease;
        }

        #pixelCanvas:hover {
            transform: scale(1.02);
        }

        .canvas-controls {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            width: 100%;
            max-width: 500px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .control-group label {
            font-weight: 600;
            margin-bottom: 8px;
            color: #374151;
            font-size: 0.9rem;
        }

        .slider-container {
            width: 100%;
            text-align: center;
        }

        input[type="range"] {
            width: 100%;
            margin-bottom: 5px;
        }

        .slider-value {
            font-size: 0.8rem;
            color: #6b7280;
            font-weight: 500;
        }

        .tools-panel {
            background: white;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }

        .panel-title {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 20px;
            color: #1f2937;
            text-align: center;
        }

        .tool-section {
            margin-bottom: 25px;
        }

        .tool-section h3 {
            font-size: 1rem;
            margin-bottom: 12px;
            color: #374151;
            font-weight: 600;
        }

        .tool-buttons {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }

        .tool-btn {
            padding: 12px 8px;
            border: 2px solid #e5e7eb;
            background: white;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.85rem;
            font-weight: 500;
            text-align: center;
        }

        .tool-btn:hover {
            border-color: #667eea;
            background: #f8fafc;
            transform: translateY(-2px);
        }

        .tool-btn.active {
            border-color: #667eea;
            background: #667eea;
            color: white;
        }

        .color-palette {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 15px;
        }

        .color-btn {
            width: 40px;
            height: 40px;
            border: 3px solid #e5e7eb;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
        }

        .color-btn:hover {
            transform: scale(1.1);
            border-color: #9ca3af;
        }

        .color-btn.active {
            border-color: #1f2937;
            transform: scale(1.15);
        }

        .color-btn.active::after {
            content: '✓';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-weight: bold;
            text-shadow: 0 0 3px rgba(0,0,0,0.8);
        }

        .custom-color {
            grid-column: span 2;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #colorPicker {
            width: 50px;
            height: 40px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .export-panel {
            background: white;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }

        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .action-btn {
            padding: 14px 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .action-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 15px rgba(0,0,0,0.2);
        }

        .primary-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .secondary-btn {
            background: #f3f4f6;
            color: #374151;
            border: 2px solid #e5e7eb;
        }

        .secondary-btn:hover {
            background: #e5e7eb;
        }

        .danger-btn {
            background: #ef4444;
            color: white;
        }

        .success-btn {
            background: #10b981;
            color: white;
        }

        .templates-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }

        .template-btn {
            padding: 8px;
            border: 2px solid #e5e7eb;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.8rem;
        }

        .template-btn:hover {
            border-color: #667eea;
            background: #f8fafc;
        }

        .layer-controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .layer-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px;
            background: #f9fafb;
            border-radius: 6px;
        }

        .layer-checkbox {
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .layer-name {
            flex: 1;
            font-size: 0.85rem;
            color: #374151;
        }

        .undo-redo {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }

        .preview-section {
            text-align: center;
            margin-bottom: 20px;
        }

        .preview-sizes {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 15px;
        }

        .preview-canvas {
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            image-rendering: pixelated;
        }

        .size-label {
            font-size: 0.8rem;
            color: #6b7280;
            margin-top: 5px;
        }

        .status-bar {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 10px 15px;
            border-radius: 25px;
            font-size: 0.85rem;
            transform: translateY(100px);
            transition: transform 0.3s ease;
        }

        .status-bar.show {
            transform: translateY(0);
        }

        @media (max-width: 1200px) {
            .main-content {
                grid-template-columns: 1fr;
                gap: 20px;
            }
            
            .header h1 {
                font-size: 2rem;
            }
        }

        .brush-preview {
            width: 30px;
            height: 30px;
            border: 2px solid #e5e7eb;
            border-radius: 4px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            background: #f9fafb;
        }

        .animation-controls {
            margin-top: 15px;
        }

        .frame-controls {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }

        .frame-btn {
            padding: 6px 12px;
            border: 1px solid #e5e7eb;
            background: white;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .frame-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Pixel Avatar Maker</h1>
            <p>Professional-grade pixel art creation tool with advanced features</p>
        </div>

        <div class="main-content">
            <div class="canvas-section">
                <div class="canvas-container">
                    <canvas id="pixelCanvas" width="480" height="480"></canvas>
                </div>
                
                <div class="canvas-controls">
                    <div class="control-group">
                        <label>Grid Size</label>
                        <div class="slider-container">
                            <input type="range" id="gridSize" min="8" max="64" value="24">
                            <div class="slider-value">24x24</div>
                        </div>
                    </div>
                    
                    <div class="control-group">
                        <label>Brush Size</label>
                        <div class="slider-container">
                            <input type="range" id="brushSize" min="1" max="5" value="1">
                            <div class="slider-value">1px</div>
                        </div>
                    </div>
                    
                    <div class="control-group">
                        <label>Zoom</label>
                        <div class="slider-container">
                            <input type="range" id="zoomLevel" min="1" max="3" value="1" step="0.1">
                            <div class="slider-value">1.0x</div>
                        </div>
                    </div>
                </div>

                <div class="preview-section">
                    <h3>Live Preview</h3>
                    <div class="preview-sizes">
                        <div>
                            <canvas id="preview32" width="32" height="32" class="preview-canvas"></canvas>
                            <div class="size-label">32x32</div>
                        </div>
                        <div>
                            <canvas id="preview64" width="64" height="64" class="preview-canvas"></canvas>
                            <div class="size-label">64x64</div>
                        </div>
                        <div>
                            <canvas id="preview128" width="128" height="128" class="preview-canvas"></canvas>
                            <div class="size-label">128x128</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="tools-panel">
                <h2 class="panel-title">Tools & Colors</h2>
                
                <div class="tool-section">
                    <h3>Drawing Tools</h3>
                    <div class="tool-buttons">
                        <button class="tool-btn active" data-tool="brush">🖌️ Brush</button>
                        <button class="tool-btn" data-tool="eraser">🗑️ Eraser</button>
                        <button class="tool-btn" data-tool="fill">🪣 Fill</button>
                        <button class="tool-btn" data-tool="eyedropper">💧 Picker</button>
                        <button class="tool-btn" data-tool="line">📏 Line</button>
                        <button class="tool-btn" data-tool="rect">⬜ Rectangle</button>
                        <button class="tool-btn" data-tool="circle">⭕ Circle</button>
                        <button class="tool-btn" data-tool="spray">💨 Spray</button>
                    </div>
                    <div class="brush-preview" id="brushPreview">1</div>
                </div>

                <div class="tool-section">
                    <h3>Color Palette</h3>
                    <div class="color-palette">
                        <div class="color-btn active" style="background-color: #000000" data-color="#000000"></div>
                        <div class="color-btn" style="background-color: #FFFFFF" data-color="#FFFFFF"></div>
                        <div class="color-btn" style="background-color: #FF0000" data-color="#FF0000"></div>
                        <div class="color-btn" style="background-color: #00FF00" data-color="#00FF00"></div>
                        <div class="color-btn" style="background-color: #0000FF" data-color="#0000FF"></div>
                        <div class="color-btn" style="background-color: #FFFF00" data-color="#FFFF00"></div>
                        <div class="color-btn" style="background-color: #FF00FF" data-color="#FF00FF"></div>
                        <div class="color-btn" style="background-color: #00FFFF" data-color="#00FFFF"></div>
                        <div class="color-btn" style="background-color: #FFA500" data-color="#FFA500"></div>
                        <div class="color-btn" style="background-color: #800080" data-color="#800080"></div>
                        <div class="color-btn" style="background-color: #FFC0CB" data-color="#FFC0CB"></div>
                        <div class="color-btn" style="background-color: #A52A2A" data-color="#A52A2A"></div>
                        <div class="custom-color">
                            <input type="color" id="colorPicker" value="#000000">
                            <span>Custom</span>
                        </div>
                    </div>
                </div>

                <div class="tool-section">
                    <h3>Quick Actions</h3>
                    <div class="undo-redo">
                        <button class="tool-btn" id="undoBtn">↶ Undo</button>
                        <button class="tool-btn" id="redoBtn">↷ Redo</button>
                    </div>
                    <div class="tool-buttons">
                        <button class="tool-btn" id="mirrorH">↔️ Mirror H</button>
                        <button class="tool-btn" id="mirrorV">↕️ Mirror V</button>
                        <button class="tool-btn" id="rotateL">↺ Rotate L</button>
                        <button class="tool-btn" id="rotateR">↻ Rotate R</button>
                    </div>
                </div>

                <div class="tool-section">
                    <h3>Templates</h3>
                    <div class="templates-grid">
                        <button class="template-btn" data-template="face">😊 Face</button>
                        <button class="template-btn" data-template="skull">💀 Skull</button>
                        <button class="template-btn" data-template="heart">❤️ Heart</button>
                        <button class="template-btn" data-template="star">⭐ Star</button>
                        <button class="template-btn" data-template="smiley">🙂 Smiley</button>
                        <button class="template-btn" data-template="alien">👽 Alien</button>
                    </div>
                </div>
            </div>

            <div class="export-panel">
                <h2 class="panel-title">Export & Manage</h2>
                
                <div class="action-buttons">
                    <button class="action-btn primary-btn" id="exportPNG">📱 Export PNG</button>
                    <button class="action-btn secondary-btn" id="saveProject">💾 Save Project</button>
                    <button class="action-btn secondary-btn" id="loadProject">📂 Load Project</button>
                    <button class="action-btn success-btn" id="randomize">🎲 Randomize</button>
                    <button class="action-btn danger-btn" id="clearCanvas">🗑️ Clear All</button>
                </div>

                <div class="tool-section">
                    <h3>Layers</h3>
                    <div class="layer-controls">
                        <div class="layer-item">
                            <input type="checkbox" class="layer-checkbox" id="layer1" checked>
                            <span class="layer-name">Base Layer</span>
                        </div>
                        <div class="layer-item">
                            <input type="checkbox" class="layer-checkbox" id="layer2">
                            <span class="layer-name">Details</span>
                        </div>
                        <div class="layer-item">
                            <input type="checkbox" class="layer-checkbox" id="layer3">
                            <span class="layer-name">Effects</span>
                        </div>
                    </div>
                </div>

                <div class="tool-section animation-controls">
                    <h3>Animation</h3>
                    <div class="frame-controls">
                        <button class="frame-btn active" data-frame="1">Frame 1</button>
                        <button class="frame-btn" data-frame="2">Frame 2</button>
                        <button class="frame-btn" data-frame="3">Frame 3</button>
                    </div>
                    <div class="action-buttons">
                        <button class="action-btn secondary-btn" id="playAnimation">▶️ Preview</button>
                        <button class="action-btn secondary-btn" id="exportGIF">🎬 Export GIF</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="status-bar" id="statusBar">Ready</div>

    <script>
        class PixelAvatarMaker {
            constructor() {
                this.canvas = document.getElementById('pixelCanvas');
                this.ctx = this.canvas.getContext('2d');
                this.gridSize = 24;
                this.pixelSize = this.canvas.width / this.gridSize;
                this.currentColor = '#000000';
                this.currentTool = 'brush';
                this.brushSize = 1;
                this.isDrawing = false;
                this.pixelData = {};
                this.history = [];
                this.historyIndex = -1;
                this.previewCanvases = ['preview32', 'preview64', 'preview128'];
                this.frames = [{}];
                this.currentFrame = 0;
                this.animationPlaying = false;
                
                this.init();
            }

            init() {
                this.setupEventListeners();
                this.drawGrid();
                this.saveState();
                this.updatePreviews();
                this.updateStatus('Pixel Avatar Maker loaded successfully');
            }

            setupEventListeners() {
                // Canvas events
                this.canvas.addEventListener('mousedown', (e) => this.startDrawing(e));
                this.canvas.addEventListener('mousemove', (e) => this.draw(e));
                this.canvas.addEventListener('mouseup', () => this.stopDrawing());
                this.canvas.addEventListener('mouseleave', () => this.stopDrawing());

                // Touch events for mobile
                this.canvas.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    const touch = e.touches[0];
                    const mouseEvent = new MouseEvent('mousedown', {
                        clientX: touch.clientX,
                        clientY: touch.clientY
                    });
                    this.canvas.dispatchEvent(mouseEvent);
                });

                this.canvas.addEventListener('touchmove', (e) => {
                    e.preventDefault();
                    const touch = e.touches[0];
                    const mouseEvent = new MouseEvent('mousemove', {
                        clientX: touch.clientX,
                        clientY: touch.clientY
                    });
                    this.canvas.dispatchEvent(mouseEvent);
                });

                this.canvas.addEventListener('touchend', (e) => {
                    e.preventDefault();
                    const mouseEvent = new MouseEvent('mouseup', {});
                    this.canvas.dispatchEvent(mouseEvent);
                });

                // Controls
                document.getElementById('gridSize').addEventListener('input', (e) => {
                    this.gridSize = parseInt(e.target.value);
                    this.pixelSize = this.canvas.width / this.gridSize;
                    e.target.nextElementSibling.textContent = `${this.gridSize}x${this.gridSize}`;
                    this.redraw();
                });

                document.getElementById('brushSize').addEventListener('input', (e) => {
                    this.brushSize = parseInt(e.target.value);
                    e.target.nextElementSibling.textContent = `${this.brushSize}px`;
                    document.getElementById('brushPreview').textContent = this.brushSize;
                });

                document.getElementById('zoomLevel').addEventListener('input', (e) => {
                    const zoom = parseFloat(e.target.value);
                    e.target.nextElementSibling.textContent = `${zoom.toFixed(1)}x`;
                    this.canvas.style.transform = `scale(${zoom})`;
                });

                // Tool buttons
                document.querySelectorAll('.tool-btn[data-tool]').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        document.querySelector('.tool-btn.active').classList.remove('active');
                        btn.classList.add('active');
                        this.currentTool = btn.dataset.tool;
                        this.updateStatus(`Tool changed to ${btn.textContent}`);
                    });
                });

                // Color buttons
                document.querySelectorAll('.color-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        document.querySelector('.color-btn.active').classList.remove('active');
                        btn.classList.add('active');
                        this.currentColor = btn.dataset.color;
                        this.updateStatus(`Color changed to ${this.currentColor}`);
                    });
                });

                document.getElementById('colorPicker').addEventListener('change', (e) => {
                    this.currentColor = e.target.value;
                    document.querySelector('.color-btn.active').classList.remove('active');
                    this.updateStatus(`Custom color selected: ${this.currentColor}`);
                });

                // Action buttons
                document.getElementById('undoBtn').addEventListener('click', () => this.undo());
                document.getElementById('redoBtn').addEventListener('click', () => this.redo());
                document.getElementById('clearCanvas').addEventListener('click', () => this.clearCanvas());
                document.getElementById('exportPNG').addEventListener('click', () => this.exportPNG());
                document.getElementById('saveProject').addEventListener('click', () => this.saveProject());
                document.getElementById('loadProject').addEventListener('click', () => this.loadProject());
                document.getElementById('randomize').addEventListener('click', () => this.randomize());

                // Transform buttons
                document.getElementById('mirrorH').addEventListener('click', () => this.mirrorHorizontal());
                document.getElementById('mirrorV').addEventListener('click', () => this.mirrorVertical());
                document.getElementById('rotateL').addEventListener('click', () => this.rotateLeft());
                document.getElementById('rotateR').addEventListener('click', () => this.rotateRight());

                // Template buttons
                document.querySelectorAll('.template-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        this.loadTemplate(btn.dataset.template);
                    });
                });

                // Frame buttons
                document.querySelectorAll('.frame-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        document.querySelector('.frame-btn.active').classList.remove('active');
                        btn.classList.add('active');
                        this.switchFrame(parseInt(btn.dataset.frame) - 1);
                    });
                });

                // Animation buttons
                document.getElementById('playAnimation').addEventListener('click', () => this.playAnimation());
                document.getElementById('exportGIF').addEventListener('click', () => this.exportGIF());

                // Keyboard shortcuts
                document.addEventListener('keydown', (e) => {
                    if (e.ctrlKey || e.metaKey) {
                        switch(e.key) {
                            case 'z':
                                e.preventDefault();
                                this.undo();
                                break;
                            case 'y':
                                e.preventDefault();
                                this.redo();
                                break;
                            case 's':
                                e.preventDefault();
                                this.saveProject();
                                break;
                        }
                    }
                });
            }

            getPixelCoords(e) {
                const rect = this.canvas.getBoundingClientRect();
                const scaleX = this.canvas.width / rect.width;
                const scaleY = this.canvas.height / rect.height;
                
                const x = Math.floor(((e.clientX - rect.left) * scaleX) / this.pixelSize);
                const y = Math.floor(((e.clientY - rect.top) * scaleY) / this.pixelSize);
                
                return { x, y };
            }

            startDrawing(e) {
                this.isDrawing = true;
                const coords = this.getPixelCoords(e);
                
                if (this.currentTool === 'eyedropper') {
                    this.pickColor(coords.x, coords.y);
                    return;
                }
                
                this.lastX = coords.x;
                this.lastY = coords.y;
                this.drawPixel(coords.x, coords.y);
            }

            draw(e) {
                if (!this.isDrawing) return;
                
                const coords = this.getPixelCoords(e);
                
                if (this.currentTool === 'line') {
                    this.drawLine(this.lastX, this.lastY, coords.x, coords.y);
                } else if (this.currentTool === 'rect') {
                    this.drawRectangle(this.lastX, this.lastY, coords.x, coords.y);
                } else if (this.currentTool === 'circle') {
                    this.drawCircle(this.lastX, this.lastY, coords.x, coords.y);
                } else {
                    this.drawPixel(coords.x, coords.y);
                }
            }

            stopDrawing() {
                if (this.isDrawing) {
                    this.isDrawing = false;
                    this.saveState();
                    this.updatePreviews();
                }
            }

            drawPixel(x, y) {
                if (x < 0 || x >= this.gridSize || y < 0 || y >= this.gridSize) return;
                
                const key = `${x},${y}`;
                
                switch (this.currentTool) {
                    case 'brush':
                        this.drawBrush(x, y);
                        break;
                    case 'eraser':
                        this.erasePixel(x, y);
                        break;
                    case 'fill':
                        this.floodFill(x, y);
                        break;
                    case 'spray':
                        this.sprayPaint(x, y);
                        break;
                }
                
                this.drawGrid();
            }

            drawBrush(x, y) {
                for (let dx = -Math.floor(this.brushSize/2); dx <= Math.floor(this.brushSize/2); dx++) {
                    for (let dy = -Math.floor(this.brushSize/2); dy <= Math.floor(this.brushSize/2); dy++) {
                        const newX = x + dx;
                        const newY = y + dy;
                        if (newX >= 0 && newX < this.gridSize && newY >= 0 && newY < this.gridSize) {
                            const key = `${newX},${newY}`;
                            this.pixelData[key] = this.currentColor;
                            this.fillPixel(newX, newY, this.currentColor);
                        }
                    }
                }
            }

            erasePixel(x, y) {
                for (let dx = -Math.floor(this.brushSize/2); dx <= Math.floor(this.brushSize/2); dx++) {
                    for (let dy = -Math.floor(this.brushSize/2); dy <= Math.floor(this.brushSize/2); dy++) {
                        const newX = x + dx;
                        const newY = y + dy;
                        if (newX >= 0 && newX < this.gridSize && newY >= 0 && newY < this.gridSize) {
                            const key = `${newX},${newY}`;
                            delete this.pixelData[key];
                            this.clearPixel(newX, newY);
                        }
                    }
                }
            }

            floodFill(x, y) {
                const key = `${x},${y}`;
                const targetColor = this.pixelData[key] || null;
                if (targetColor === this.currentColor) return;
                
                const stack = [{x, y}];
                const visited = new Set();
                
                while (stack.length > 0) {
                    const {x: cx, y: cy} = stack.pop();
                    const currentKey = `${cx},${cy}`;
                    
                    if (visited.has(currentKey) || cx < 0 || cx >= this.gridSize || cy < 0 || cy >= this.gridSize) continue;
                    
                    const currentColor = this.pixelData[currentKey] || null;
                    if (currentColor !== targetColor) continue;
                    
                    visited.add(currentKey);
                    this.pixelData[currentKey] = this.currentColor;
                    this.fillPixel(cx, cy, this.currentColor);
                    
                    stack.push({x: cx + 1, y: cy});
                    stack.push({x: cx - 1, y: cy});
                    stack.push({x: cx, y: cy + 1});
                    stack.push({x: cx, y: cy - 1});
                }
            }

            sprayPaint(x, y) {
                const radius = this.brushSize + 2;
                const density = 0.3;
                
                for (let i = 0; i < 20; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const distance = Math.random() * radius;
                    const sprayX = Math.floor(x + Math.cos(angle) * distance);
                    const sprayY = Math.floor(y + Math.sin(angle) * distance);
                    
                    if (Math.random() < density && sprayX >= 0 && sprayX < this.gridSize && sprayY >= 0 && sprayY < this.gridSize) {
                        const key = `${sprayX},${sprayY}`;
                        this.pixelData[key] = this.currentColor;
                        this.fillPixel(sprayX, sprayY, this.currentColor);
                    }
                }
            }

            drawLine(x1, y1, x2, y2) {
                this.redraw();
                
                const dx = Math.abs(x2 - x1);
                const dy = Math.abs(y2 - y1);
                const sx = x1 < x2 ? 1 : -1;
                const sy = y1 < y2 ? 1 : -1;
                let err = dx - dy;
                
                let x = x1, y = y1;
                
                while (true) {
                    this.ctx.fillStyle = this.currentColor;
                    this.ctx.fillRect(x * this.pixelSize, y * this.pixelSize, this.pixelSize, this.pixelSize);
                    
                    if (x === x2 && y === y2) break;
                    
                    const e2 = 2 * err;
                    if (e2 > -dy) {
                        err -= dy;
                        x += sx;
                    }
                    if (e2 < dx) {
                        err += dx;
                        y += sy;
                    }
                }
            }

            drawRectangle(x1, y1, x2, y2) {
                this.redraw();
                
                const startX = Math.min(x1, x2);
                const startY = Math.min(y1, y2);
                const endX = Math.max(x1, x2);
                const endY = Math.max(y1, y2);
                
                this.ctx.fillStyle = this.currentColor;
                this.ctx.fillRect(startX * this.pixelSize, startY * this.pixelSize, 
                    (endX - startX + 1) * this.pixelSize, (endY - startY + 1) * this.pixelSize);
            }

            drawCircle(x1, y1, x2, y2) {
                this.redraw();
                
                const centerX = x1;
                const centerY = y1;
                const radius = Math.sqrt(Math.pow(x2 - x1, 2) + Math.pow(y2 - y1, 2));
                
                for (let x = 0; x < this.gridSize; x++) {
                    for (let y = 0; y < this.gridSize; y++) {
                        const distance = Math.sqrt(Math.pow(x - centerX, 2) + Math.pow(y - centerY, 2));
                        if (Math.abs(distance - radius) < 0.5) {
                            this.ctx.fillStyle = this.currentColor;
                            this.ctx.fillRect(x * this.pixelSize, y * this.pixelSize, this.pixelSize, this.pixelSize);
                        }
                    }
                }
            }

            pickColor(x, y) {
                const key = `${x},${y}`;
                if (this.pixelData[key]) {
                    this.currentColor = this.pixelData[key];
                    document.getElementById('colorPicker').value = this.currentColor;
                    
                    // Update active color button
                    document.querySelectorAll('.color-btn').forEach(btn => {
                        btn.classList.remove('active');
                        if (btn.dataset.color === this.currentColor) {
                            btn.classList.add('active');
                        }
                    });
                    
                    this.updateStatus(`Color picked: ${this.currentColor}`);
                }
            }

            fillPixel(x, y, color) {
                this.ctx.fillStyle = color;
                this.ctx.fillRect(x * this.pixelSize, y * this.pixelSize, this.pixelSize, this.pixelSize);
            }

            clearPixel(x, y) {
                this.ctx.clearRect(x * this.pixelSize, y * this.pixelSize, this.pixelSize, this.pixelSize);
            }

            drawGrid() {
                this.ctx.strokeStyle = '#e5e7eb';
                this.ctx.lineWidth = 1;
                
                for (let i = 0; i <= this.gridSize; i++) {
                    const pos = i * this.pixelSize;
                    
                    this.ctx.beginPath();
                    this.ctx.moveTo(pos, 0);
                    this.ctx.lineTo(pos, this.canvas.height);
                    this.ctx.stroke();
                    
                    this.ctx.beginPath();
                    this.ctx.moveTo(0, pos);
                    this.ctx.lineTo(this.canvas.width, pos);
                    this.ctx.stroke();
                }
            }

            redraw() {
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                
                // Redraw pixels
                for (const [key, color] of Object.entries(this.pixelData)) {
                    const [x, y] = key.split(',').map(Number);
                    this.fillPixel(x, y, color);
                }
                
                this.drawGrid();
            }

            clearCanvas() {
                if (confirm('Are you sure you want to clear the canvas?')) {
                    this.pixelData = {};
                    this.redraw();
                    this.saveState();
                    this.updatePreviews();
                    this.updateStatus('Canvas cleared');
                }
            }

            saveState() {
                this.history = this.history.slice(0, this.historyIndex + 1);
                this.history.push(JSON.parse(JSON.stringify(this.pixelData)));
                this.historyIndex++;
                
                if (this.history.length > 50) {
                    this.history.shift();
                    this.historyIndex--;
                }
            }

            undo() {
                if (this.historyIndex > 0) {
                    this.historyIndex--;
                    this.pixelData = JSON.parse(JSON.stringify(this.history[this.historyIndex]));
                    this.redraw();
                    this.updatePreviews();
                    this.updateStatus('Undo applied');
                }
            }

            redo() {
                if (this.historyIndex < this.history.length - 1) {
                    this.historyIndex++;
                    this.pixelData = JSON.parse(JSON.stringify(this.history[this.historyIndex]));
                    this.redraw();
                    this.updatePreviews();
                    this.updateStatus('Redo applied');
                }
            }

            mirrorHorizontal() {
                const newPixelData = {};
                for (const [key, color] of Object.entries(this.pixelData)) {
                    const [x, y] = key.split(',').map(Number);
                    const newX = this.gridSize - 1 - x;
                    newPixelData[`${newX},${y}`] = color;
                }
                this.pixelData = newPixelData;
                this.redraw();
                this.saveState();
                this.updatePreviews();
                this.updateStatus('Mirrored horizontally');
            }

            mirrorVertical() {
                const newPixelData = {};
                for (const [key, color] of Object.entries(this.pixelData)) {
                    const [x, y] = key.split(',').map(Number);
                    const newY = this.gridSize - 1 - y;
                    newPixelData[`${x},${newY}`] = color;
                }
                this.pixelData = newPixelData;
                this.redraw();
                this.saveState();
                this.updatePreviews();
                this.updateStatus('Mirrored vertically');
            }

            rotateLeft() {
                const newPixelData = {};
                for (const [key, color] of Object.entries(this.pixelData)) {
                    const [x, y] = key.split(',').map(Number);
                    const newX = y;
                    const newY = this.gridSize - 1 - x;
                    newPixelData[`${newX},${newY}`] = color;
                }
                this.pixelData = newPixelData;
                this.redraw();
                this.saveState();
                this.updatePreviews();
                this.updateStatus('Rotated left');
            }

            rotateRight() {
                const newPixelData = {};
                for (const [key, color] of Object.entries(this.pixelData)) {
                    const [x, y] = key.split(',').map(Number);
                    const newX = this.gridSize - 1 - y;
                    const newY = x;
                    newPixelData[`${newX},${newY}`] = color;
                }
                this.pixelData = newPixelData;
                this.redraw();
                this.saveState();
                this.updatePreviews();
                this.updateStatus('Rotated right');
            }

            randomize() {
                const colors = ['#FF0000', '#00FF00', '#0000FF', '#FFFF00', '#FF00FF', '#00FFFF', '#FFA500', '#800080'];
                this.pixelData = {};
                
                const density = 0.3;
                for (let x = 0; x < this.gridSize; x++) {
                    for (let y = 0; y < this.gridSize; y++) {
                        if (Math.random() < density) {
                            const key = `${x},${y}`;
                            this.pixelData[key] = colors[Math.floor(Math.random() * colors.length)];
                        }
                    }
                }
                
                this.redraw();
                this.saveState();
                this.updatePreviews();
                this.updateStatus('Random pattern generated');
            }

            loadTemplate(template) {
                this.pixelData = {};
                const center = Math.floor(this.gridSize / 2);
                
                switch (template) {
                    case 'face':
                        this.drawTemplatePixels([
                            {x: center-2, y: center-2, color: '#000000'}, // left eye
                            {x: center+2, y: center-2, color: '#000000'}, // right eye
                            {x: center, y: center, color: '#FF0000'}, // nose
                            {x: center-2, y: center+2, color: '#000000'}, // mouth left
                            {x: center-1, y: center+2, color: '#000000'}, // mouth center-left
                            {x: center+1, y: center+2, color: '#000000'}, // mouth center-right
                            {x: center+2, y: center+2, color: '#000000'}, // mouth right
                        ]);
                        break;
                    case 'skull':
                        this.drawTemplatePixels([
                            {x: center-3, y: center-3, color: '#FFFFFF'},
                            {x: center-2, y: center-3, color: '#FFFFFF'},
                            {x: center-1, y: center-3, color: '#FFFFFF'},
                            {x: center, y: center-3, color: '#FFFFFF'},
                            {x: center+1, y: center-3, color: '#FFFFFF'},
                            {x: center+2, y: center-3, color: '#FFFFFF'},
                            {x: center+3, y: center-3, color: '#FFFFFF'},
                            {x: center-2, y: center-1, color: '#000000'},
                            {x: center+2, y: center-1, color: '#000000'},
                            {x: center, y: center+1, color: '#000000'},
                            {x: center-1, y: center+2, color: '#000000'},
                            {x: center, y: center+2, color: '#000000'},
                            {x: center+1, y: center+2, color: '#000000'},
                        ]);
                        break;
                    case 'heart':
                        this.drawTemplatePixels([
                            {x: center-2, y: center-1, color: '#FF0000'},
                            {x: center-1, y: center-2, color: '#FF0000'},
                            {x: center, y: center-2, color: '#FF0000'},
                            {x: center+1, y: center-2, color: '#FF0000'},
                            {x: center+2, y: center-1, color: '#FF0000'},
                            {x: center-3, y: center, color: '#FF0000'},
                            {x: center+3, y: center, color: '#FF0000'},
                            {x: center-2, y: center+1, color: '#FF0000'},
                            {x: center+2, y: center+1, color: '#FF0000'},
                            {x: center-1, y: center+2, color: '#FF0000'},
                            {x: center+1, y: center+2, color: '#FF0000'},
                            {x: center, y: center+3, color: '#FF0000'},
                        ]);
                        break;
                    case 'star':
                        this.drawTemplatePixels([
                            {x: center, y: center-3, color: '#FFFF00'},
                            {x: center-1, y: center-1, color: '#FFFF00'},
                            {x: center+1, y: center-1, color: '#FFFF00'},
                            {x: center-3, y: center-1, color: '#FFFF00'},
                            {x: center+3, y: center-1, color: '#FFFF00'},
                            {x: center-2, y: center+1, color: '#FFFF00'},
                            {x: center+2, y: center+1, color: '#FFFF00'},
                            {x: center, y: center+2, color: '#FFFF00'},
                        ]);
                        break;
                    case 'smiley':
                        this.drawTemplatePixels([
                            {x: center-2, y: center-2, color: '#000000'},
                            {x: center+2, y: center-2, color: '#000000'},
                            {x: center-2, y: center+1, color: '#000000'},
                            {x: center-1, y: center+2, color: '#000000'},
                            {x: center, y: center+2, color: '#000000'},
                            {x: center+1, y: center+2, color: '#000000'},
                            {x: center+2, y: center+1, color: '#000000'},
                        ]);
                        break;
                    case 'alien':
                        this.drawTemplatePixels([
                            {x: center-1, y: center-3, color: '#00FF00'},
                            {x: center, y: center-3, color: '#00FF00'},
                            {x: center+1, y: center-3, color: '#00FF00'},
                            {x: center-2, y: center-2, color: '#00FF00'},
                            {x: center+2, y: center-2, color: '#00FF00'},
                            {x: center-2, y: center-1, color: '#000000'},
                            {x: center+2, y: center-1, color: '#000000'},
                            {x: center, y: center+1, color: '#000000'},
                        ]);
                        break;
                }
                
                this.redraw();
                this.saveState();
                this.updatePreviews();
                this.updateStatus(`Template loaded: ${template}`);
            }

            drawTemplatePixels(pixels) {
                pixels.forEach(pixel => {
                    if (pixel.x >= 0 && pixel.x < this.gridSize && pixel.y >= 0 && pixel.y < this.gridSize) {
                        const key = `${pixel.x},${pixel.y}`;
                        this.pixelData[key] = pixel.color;
                    }
                });
            }

            updatePreviews() {
                this.previewCanvases.forEach(canvasId => {
                    const canvas = document.getElementById(canvasId);
                    const ctx = canvas.getContext('2d');
                    const size = canvas.width;
                    const pixelSize = size / this.gridSize;
                    
                    ctx.clearRect(0, 0, size, size);
                    ctx.imageSmoothingEnabled = false;
                    
                    for (const [key, color] of Object.entries(this.pixelData)) {
                        const [x, y] = key.split(',').map(Number);
                        ctx.fillStyle = color;
                        ctx.fillRect(x * pixelSize, y * pixelSize, pixelSize, pixelSize);
                    }
                });
            }

            exportPNG() {
                const exportCanvas = document.createElement('canvas');
                const exportCtx = exportCanvas.getContext('2d');
                const exportSize = 512;
                exportCanvas.width = exportSize;
                exportCanvas.height = exportSize;
                
                exportCtx.imageSmoothingEnabled = false;
                const pixelSize = exportSize / this.gridSize;
                
                for (const [key, color] of Object.entries(this.pixelData)) {
                    const [x, y] = key.split(',').map(Number);
                    exportCtx.fillStyle = color;
                    exportCtx.fillRect(x * pixelSize, y * pixelSize, pixelSize, pixelSize);
                }
                
                const link = document.createElement('a');
                link.download = `pixel-avatar-${Date.now()}.png`;
                link.href = exportCanvas.toDataURL();
                link.click();
                
                this.updateStatus('PNG exported successfully');
            }

            saveProject() {
                const projectData = {
                    pixelData: this.pixelData,
                    gridSize: this.gridSize,
                    frames: this.frames,
                    currentFrame: this.currentFrame,
                    timestamp: Date.now()
                };
                
                const dataStr = JSON.stringify(projectData, null, 2);
                const dataBlob = new Blob([dataStr], {type: 'application/json'});
                
                const link = document.createElement('a');
                link.download = `pixel-avatar-project-${Date.now()}.json`;
                link.href = URL.createObjectURL(dataBlob);
                link.click();
                
                this.updateStatus('Project saved successfully');
            }

            loadProject() {
                const input = document.createElement('input');
                input.type = 'file';
                input.accept = '.json';
                
                input.onchange = (e) => {
                    const file = e.target.files[0];
                    if (file) {
                        const reader = new FileReader();
                        reader.onload = (e) => {
                            try {
                                const projectData = JSON.parse(e.target.result);
                                this.pixelData = projectData.pixelData || {};
                                this.gridSize = projectData.gridSize || 24;
                                this.frames = projectData.frames || [{}];
                                this.currentFrame = projectData.currentFrame || 0;
                                
                                document.getElementById('gridSize').value = this.gridSize;
                                document.getElementById('gridSize').nextElementSibling.textContent = `${this.gridSize}x${this.gridSize}`;
                                this.pixelSize = this.canvas.width / this.gridSize;
                                
                                this.redraw();
                                this.saveState();
                                this.updatePreviews();
                                this.updateStatus('Project loaded successfully');
                            } catch (error) {
                                this.updateStatus('Error loading project file');
                            }
                        };
                        reader.readAsText(file);
                    }
                };
                
                input.click();
            }

            switchFrame(frameIndex) {
                this.frames[this.currentFrame] = JSON.parse(JSON.stringify(this.pixelData));
                this.currentFrame = frameIndex;
                
                if (!this.frames[frameIndex]) {
                    this.frames[frameIndex] = {};
                }
                
                this.pixelData = JSON.parse(JSON.stringify(this.frames[frameIndex]));
                this.redraw();
                this.updatePreviews();
                this.updateStatus(`Switched to frame ${frameIndex + 1}`);
            }

            playAnimation() {
                if (this.animationPlaying) {
                    clearInterval(this.animationInterval);
                    this.animationPlaying = false;
                    document.getElementById('playAnimation').textContent = '▶️ Preview';
                    return;
                }
                
                this.animationPlaying = true;
                document.getElementById('playAnimation').textContent = '⏸️ Stop';
                let currentFrame = 0;
                
                this.animationInterval = setInterval(() => {
                    this.pixelData = JSON.parse(JSON.stringify(this.frames[currentFrame] || {}));
                    this.redraw();
                    this.updatePreviews();
                    currentFrame = (currentFrame + 1) % this.frames.length;
                }, 500);
            }

            exportGIF() {
                this.updateStatus('GIF export feature coming soon!');
            }

            updateStatus(message) {
                const statusBar = document.getElementById('statusBar');
                statusBar.textContent = message;
                statusBar.classList.add('show');
                
                setTimeout(() => {
                    statusBar.classList.remove('show');
                }, 3000);
            }
        }

        // Initialize the application
        window.addEventListener('DOMContentLoaded', () => {
            new PixelAvatarMaker();
        });
    </script>
</body>
